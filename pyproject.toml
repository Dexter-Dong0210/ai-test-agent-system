[project]
name = "ai-test-agent-system-platform"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.0",
    "apscheduler>=3.11.0",
    "asyncpg>=0.31.0",
    "deepagents>=0.6.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jsonpath-ng>=1.8.0",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph-cli[inmem]>=0.4.26",
    "minio>=7.2.20",
    "motor>=3.7.1",
    "psycopg>=3.3.4",
    "passlib[bcrypt]>=1.7.4",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.3.1",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.28",
    "redis>=7.4.0",
    "sse-starlette==2.1.3",
    "starlette>=1.0.0",
    "structlog>=25.5.0",
    "pydantic[email]>=2.13.4",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    "python-jose>=3.5.0",
    "openpyxl>=3.1.5",
    "langchain-pymupdf4llm>=0.5.0",
    "aiohttp>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.3.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=60",
]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # defaults
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # custom
  | migrations
  | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
skip = [".venv", "migrations", "alembic"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "migrations/",
    "alembic/",
    ".venv/",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations", "alembic"]
skips = ["B101", "B601"]

